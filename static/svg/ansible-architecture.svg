<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="800" height="450" viewBox="-0.5 -0.5 800 450" style="background-color: rgb(255, 255, 255);">
  <defs>
    <clipPath id="mx-clip-400-300-400-300"><rect x="400" y="300" width="400" height="300"/></clipPath>
  </defs>
  <g>
    <!-- Title -->
    <text x="400" y="25" fill="#333" font-family="Helvetica" font-size="18" font-weight="bold" text-anchor="middle">Ansible Architecture — RHCE Exam Setup</text>

    <!-- Control Node -->
    <rect x="50" y="50" width="180" height="200" rx="8" ry="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" pointer-events="none"/>
    <text x="140" y="80" fill="#1565c0" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle">Control Node</text>
    <text x="140" y="105" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">(your lab VM or EC2)</text>
    <text x="70" y="125" fill="#555" font-family="Helvetica" font-size="11" text-anchor="start" width="140">• Ansible installed• Inventory file• SSH keys• Playbooks &amp; roles• Ansible Vault</text>
    <text x="140" y="225" fill="#1565c0" font-family="Helvetica" font-size="12" font-weight="bold" text-anchor="middle">ansible-playbook</text>

    <!-- Arrow to web01 -->
    <path d="M 230 150 L 300 110" fill="none" stroke="#333" stroke-width="2" stroke-miterlimit="10" pointer-events="none"/>
    <path d="M 300 110 L 295 105 L 300 110 L 295 115 Z" fill="#333" stroke="#333" stroke-width="2" pointer-events="none"/>
    <text x="265" y="95" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">SSH</text>

    <!-- Arrow to db01 -->
    <path d="M 230 150 L 300 190" fill="none" stroke="#333" stroke-width="2" stroke-miterlimit="10" pointer-events="none"/>
    <path d="M 300 190 L 295 195 L 300 190 L 295 185 Z" fill="#333" stroke="#333" stroke-width="2" pointer-events="none"/>
    <text x="265" y="205" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">SSH</text>

    <!-- Managed Node: web01 -->
    <rect x="310" y="70" width="180" height="120" rx="8" ry="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" pointer-events="none"/>
    <text x="400" y="98" fill="#2e7d32" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle">web01</text>
    <text x="400" y="118" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">RHEL 9 · [webservers]</text>
    <text x="330" y="138" fill="#555" font-family="Helvetica" font-size="10" text-anchor="start" width="140">• httpd installed• httpd service• firewalld port 80• SELinux context</text>

    <!-- Managed Node: db01 -->
    <rect x="310" y="160" width="180" height="120" rx="8" ry="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" pointer-events="none"/>
    <text x="400" y="188" fill="#2e7d32" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle">db01</text>
    <text x="400" y="208" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">RHEL 9 · [dbservers]</text>
    <text x="330" y="228" fill="#555" font-family="Helvetica" font-size="10" text-anchor="start" width="140">• postgresql-server• postgresql service• firewalld port 5432• vaulted password</text>

    <!-- Inventory box -->
    <rect x="500" y="50" width="250" height="140" rx="8" ry="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" pointer-events="none"/>
    <text x="625" y="78" fill="#f57f17" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle">inventory.ini</text>
    <text x="520" y="100" fill="#333" font-family="Courier" font-size="10" text-anchor="start">[webservers]</text>
    <text x="520" y="112" fill="#333" font-family="Courier" font-size="10" text-anchor="start">web01 ansible_user=ec2-user</text>
    <text x="520" y="124" fill="#333" font-family="Courier" font-size="10" text-anchor="start">[dbservers]</text>
    <text x="520" y="136" fill="#333" font-family="Courier" font-size="10" text-anchor="start">db01 ansible_user=ec2-user</text>
    <text x="625" y="160" fill="#666" font-family="Helvetica" font-size="10" text-anchor="middle">No agent on managed nodes</text>

    <!-- Vault box -->
    <rect x="500" y="210" width="250" height="100" rx="8" ry="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" pointer-events="none"/>
    <text x="625" y="238" fill="#6a1b9a" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle">vault.yml</text>
    <text x="520" y="260" fill="#333" font-family="Courier" font-size="10" text-anchor="start">db_root_password:</text>
    <text x="620" y="260" fill="#333" font-family="Courier" font-size="10" text-anchor="start">encrypted</text>
    <text x="520" y="272" fill="#333" font-family="Courier" font-size="10" text-anchor="start">db_app_password:</text>
    <text x="620" y="272" fill="#333" font-family="Courier" font-size="10" text-anchor="start">encrypted</text>
    <text x="625" y="288" fill="#666" font-family="Helvetica" font-size="10" text-anchor="middle">--ask-vault-pass</text>
  </g>
</svg>
